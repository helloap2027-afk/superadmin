# NGINX Reverse Proxy Configuration for HELLO Services
# Path: /etc/nginx/conf.d/hello-hi.in.conf

# 1. API Gateway (api.hello-hi.in)
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.hello-hi.in;

    ssl_certificate /var/cpanel/ssl/apache_tls/api.hello-hi.in/combined;
    ssl_certificate_key /var/cpanel/ssl/apache_tls/api.hello-hi.in/combined;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 15M;
    }
}

# 2. Public Website (hello-hi.in)
server {
    listen 80;
    listen 443 ssl http2;
    server_name hello-hi.in www.hello-hi.in;

    ssl_certificate /var/cpanel/ssl/apache_tls/hello-hi.in/combined;
    ssl_certificate_key /var/cpanel/ssl/apache_tls/hello-hi.in/combined;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Super Admin Panel (admin.hello-hi.in)
server {
    listen 80;
    listen 443 ssl http2;
    server_name admin.hello-hi.in;

    ssl_certificate /var/cpanel/ssl/apache_tls/admin.hello-hi.in/combined;
    ssl_certificate_key /var/cpanel/ssl/apache_tls/admin.hello-hi.in/combined;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

